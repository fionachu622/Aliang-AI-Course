<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "PingFang SC";
        src: local("PingFang SC");
      }
      @font-face {
        font-family: "Microsoft YaHei";
        src: local("Microsoft YaHei");
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f7f5ef;
      }
      body {
        color: #161a22;
        font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f7f5ef;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background-color: #f7f5ef;
      }
      #scene-1 { z-index: 1; }
      #scene-2 { z-index: 2; opacity: 0; }
      #scene-3 { z-index: 3; opacity: 0; }
      .grid {
        position: absolute;
        inset: 0;
        opacity: .3;
        background-image:
          linear-gradient(rgba(22, 26, 34, .055) 1px, rgba(247, 245, 239, 0) 1px),
          linear-gradient(90deg, rgba(22, 26, 34, .055) 1px, rgba(247, 245, 239, 0) 1px);
        background-size: 80px 80px;
        mask-image: radial-gradient(circle at 50% 50%, #000 0%, rgba(0, 0, 0, .85) 42%, rgba(0, 0, 0, 0) 82%);
      }
      .glow {
        position: absolute;
        left: 50%;
        top: 51%;
        width: 880px;
        height: 640px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: radial-gradient(circle, rgba(49, 89, 245, .08), rgba(49, 89, 245, 0) 69%);
      }
      .frame-content {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        padding: 72px 122px 92px;
        display: flex;
        flex-direction: column;
        gap: 44px;
      }
      .meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: #74776f;
        font-family: "IBM Plex Mono", monospace;
        font-size: 24px;
        font-weight: 600;
        letter-spacing: .06em;
        font-variant-numeric: tabular-nums;
      }
      .lesson-name {
        color: #161a22;
        font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        font-weight: 760;
        letter-spacing: .02em;
      }
      .lesson-name::before {
        content: "";
        width: 14px;
        height: 14px;
        margin-right: 15px;
        display: inline-block;
        border-radius: 50%;
        background: #3159f5;
      }
      .canvas {
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Scene 1 */
      .familiar-stage {
        width: 1560px;
        height: 740px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 112px;
      }
      .brand-zone {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 42px;
      }
      .overline {
        color: #74776f;
        font-size: 34px;
        font-weight: 760;
        letter-spacing: .12em;
      }
      .brands {
        width: 1420px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        align-items: center;
        text-align: center;
      }
      .brand {
        font-size: 78px;
        line-height: 1;
        font-weight: 900;
        letter-spacing: -.05em;
      }
      .brand.deepseek { color: #3159f5; }
      .brand.doubao { color: #f05a32; }
      .exchange {
        width: 1420px;
        height: 190px;
        display: grid;
        grid-template-columns: 300px 1fr 300px;
        align-items: center;
        gap: 64px;
      }
      .endpoint { text-align: center; }
      .endpoint small {
        display: block;
        margin-bottom: 13px;
        color: #74776f;
        font-size: 25px;
        font-weight: 760;
        letter-spacing: .1em;
      }
      .endpoint strong {
        display: block;
        font-size: 76px;
        line-height: 1;
        font-weight: 900;
        letter-spacing: -.055em;
      }
      .endpoint.output strong { color: #3159f5; }
      .flow {
        position: relative;
        height: 80px;
        display: flex;
        align-items: center;
      }
      .flow-line {
        width: 100%;
        height: 4px;
        position: relative;
        background: #161a22;
        transform-origin: left center;
      }
      .flow-line::after {
        content: "";
        position: absolute;
        right: 0;
        top: 50%;
        width: 22px;
        height: 22px;
        border-top: 4px solid #161a22;
        border-right: 4px solid #161a22;
        transform: translateY(-50%) rotate(45deg);
      }
      .traveler {
        position: absolute;
        left: calc(100% - 56px);
        top: 50%;
        width: 28px;
        height: 28px;
        margin-top: -14px;
        border-radius: 50%;
        background: #f05a32;
        box-shadow: 0 0 0 14px rgba(240, 90, 50, .13);
      }

      /* Scene 2 */
      .gap-stage {
        width: 1540px;
        height: 760px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 94px;
      }
      .gap-line {
        width: 1460px;
        display: grid;
        grid-template-columns: 300px 1fr 210px 1fr 300px;
        align-items: center;
        gap: 30px;
      }
      .line-half {
        height: 4px;
        background: #c9c7bf;
        transform-origin: center;
      }
      .unknown {
        width: 210px;
        height: 210px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        color: #fff;
        background: #161a22;
        box-shadow: 0 0 0 24px rgba(49, 89, 245, .12);
        font-family: Georgia, serif;
        font-size: 122px;
        font-weight: 900;
        line-height: 1;
      }
      .question {
        max-width: 1400px;
        font-size: 112px;
        line-height: 1.05;
        font-weight: 900;
        letter-spacing: -.055em;
        text-align: center;
      }

      /* Scene 3 */
      .product-stage {
        width: 1490px;
        height: 750px;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .product-shell {
        position: absolute;
        inset: 28px 26px 20px;
        border: 5px solid #161a22;
        border-radius: 92px;
      }
      .product-label {
        position: absolute;
        left: 50%;
        top: 3px;
        transform: translateX(-50%);
        padding: 15px 44px;
        color: #161a22;
        background: #f7f5ef;
        font-size: 54px;
        line-height: 1;
        font-weight: 900;
        letter-spacing: -.035em;
      }
      .feature-rail {
        position: absolute;
        left: 50%;
        top: 160px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 23px;
        color: #74776f;
        font-size: 34px;
        font-weight: 760;
        letter-spacing: .04em;
      }
      .feature + .feature::before {
        content: "·";
        margin-right: 23px;
        color: #c9c7bf;
      }
      .core-halo {
        width: 470px;
        height: 292px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        border-radius: 50%;
        background: #dfe5ff;
        box-shadow:
          0 0 0 24px rgba(49, 89, 245, .08),
          0 0 0 48px rgba(49, 89, 245, .035);
      }
      .core-halo::before,
      .core-halo::after {
        content: "";
        position: absolute;
        top: 50%;
        width: 150px;
        height: 5px;
        background: #3159f5;
      }
      .core-halo::before { left: -190px; }
      .core-halo::after { right: -190px; }
      .model-core {
        color: #3159f5;
        font-size: 104px;
        line-height: 1;
        font-weight: 900;
        letter-spacing: -.06em;
        white-space: nowrap;
      }
      .relation {
        position: absolute;
        left: 50%;
        bottom: 98px;
        transform: translateX(-50%);
        color: #f05a32;
        font-size: 38px;
        line-height: 1;
        font-weight: 860;
        white-space: nowrap;
      }
      .relation::before,
      .relation::after {
        content: "";
        width: 62px;
        height: 5px;
        margin: 0 17px;
        display: inline-block;
        background: #f05a32;
        vertical-align: .22em;
      }
    </style>
  </head>
